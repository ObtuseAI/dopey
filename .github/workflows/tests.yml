name: tests

on:
  push:
    branches:
      - master
      - public-release
      - codex/acceleration-control-plane-v4
  pull_request:
    branches:
      - master
      - public-release
      - codex/acceleration-control-plane-v4

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifest:
    name: validate CI manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_SHARD_COUNT: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate dependency consistency
        run: python -m pip check

      - name: Verify public source boundary
        run: python -m operator_tools.verify_public_source_boundary

      - name: Verify protected manifest
        run: >-
          python -c "from pathlib import Path;
          from verifier.protected_manifest import verify_ascendancy_protected_manifest;
          root = Path.cwd();
          verify_ascendancy_protected_manifest(root, root / 'PROTECTED_MANIFEST.json')"

      - name: Validate operational test coverage
        env:
          MINIMUM_COLLECTED_TESTS: "800"
        run: |
          bash .github/ci/validate_fast_subset.sh "${MINIMUM_COLLECTED_TESTS}"

  pytest:
    name: pytest (shard ${{ matrix.shard }}/4)
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NSHARDS: 4
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Select this shard's test files
        id: select
        run: |
          shard_file="${RUNNER_TEMP}/dopey-shard-${{ matrix.shard }}.txt"
          python -m operator_tools.ci_shards select \
            --repository-root "${GITHUB_WORKSPACE}" \
            --manifest ".github/ci/fast_subset.txt" \
            --shards "${NSHARDS}" \
            --shard "${{ matrix.shard }}" \
            --output "${shard_file}"
          echo "DOPEY_SHARD_FILE=${shard_file}" >> "${GITHUB_ENV}"
          echo "Shard ${{ matrix.shard }}/${NSHARDS} will run:"
          cat "${shard_file}"

      - name: Assert clean worktree before tests
        run: |
          pollution="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "${pollution}" ]; then
            echo "CI setup left the working tree dirty before pytest:"
            echo "${pollution}"
            exit 1
          fi

      - name: Run pytest
        run: |
          mapfile -t shard_files < "${DOPEY_SHARD_FILE}"
          if [ "${#shard_files[@]}" -eq 0 ]; then
            echo "Deterministic shard plan assigned no files."
            exit 1
          fi
          python -m pytest -q -p no:cacheprovider "${shard_files[@]}"

      - name: Fail if tests polluted the working tree
        run: |
          git diff --check
          pollution="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "${pollution}" ]; then
            echo "Test run left the working tree dirty:"
            echo "${pollution}"
            exit 1
          fi

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff check
        run: |
          ruff check . --select E9,F63,F7,F82
          ruff check \
            dopey \
            dopey_acceleration \
            dopey_execution \
            dopey_governor \
            dopey_signal_research \
            dopey_squeeze_bubble \
            dopey_targeting \
            operator_tools \
            dopey_analysis/real_history_signal_engine.py \
            dopey_autonomy/run_resilient_research_supervisor.py \
            dopey_backtest/forward_paper_walk.py \
            dopey_core/market_calendar.py \
            dopey_dashboard/control_center_state.py \
            dopey_data/history_models.py \
            dopey_data/history_store.py \
            dopey_data/history_validator.py \
            dopey_market_intake/macro_context_gate.py \
            dopey_market_intake/market_data_lake_builder.py \
            dopey_ops/pipeline_forecast_card.py \
            dopey_options/model_iv_calibration.py \
            dopey_options/model_iv_calibration_contract.py \
            dopey_universe/discovery_engine.py

  desktop:
    name: desktop (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Typecheck desktop
        run: npm --prefix desktop run typecheck

      - name: Build desktop
        run: npm --prefix desktop run build
